services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  merchant-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: merchants
    volumes:
      - merchant-data:/var/lib/postgresql/data

  merchant-service:
    build: ./MerchantService
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://user:pass@merchant-db:5432/merchants
    depends_on:
      - merchant-db
      
  buyer-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: buyers
    volumes:
      - buyer-data:/var/lib/postgresql/data

  buyer-service:
    build: ./BuyerService
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg2://user:pass@buyer-db:5432/buyers
    depends_on:
      - buyer-db

  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: inventory
    volumes:
      - inventory-data:/var/lib/postgresql/data

  inventory-service:
    build: ./InventoryService
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+psycopg2://user:pass@inventory-db:5432/inventory
    depends_on:
      - inventory-db
  
volumes:
  merchant-data:
  buyer-data:
  inventory-data: