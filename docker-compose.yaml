services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    merchant-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: merchants
    volumes:
      - merchant-data:/var/lib/postgresql/data

  merchant-service:
    build: ./MerchantService
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://user:pass@merchant-db:5432/merchants
    depends_on:
      - merchant-db

volumes:
  merchant-data: